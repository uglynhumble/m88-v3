name: Deploy to REG.RU

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-reg-ru-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.REG_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
          REG_DEPLOY_PATH: ${{ secrets.REG_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$REG_SFTP_HOST"
          test -n "$REG_SFTP_USER"
          test -n "$REG_SFTP_PASSWORD"
          test -n "$REG_DEPLOY_PATH"
          test "$REG_DEPLOY_PATH" != "/"
          test ${#REG_DEPLOY_PATH} -gt 5

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy site over SFTP
        env:
          REG_SFTP_HOST: ${{ secrets.REG_SFTP_HOST }}
          REG_SFTP_USER: ${{ secrets.REG_SFTP_USER }}
          REG_SFTP_PASSWORD: ${{ secrets.REG_SFTP_PASSWORD }}
          REG_DEPLOY_PATH: ${{ secrets.REG_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          # REG.RU opens SFTP inside /var/www/<user>/data. Accept the full
          # server path from the secret, but convert it to an SFTP-relative
          # path so the directory tree is not created a second time.
          deploy_path="${REG_DEPLOY_PATH//\"/}"
          deploy_path="${deploy_path//$'\r'/}"
          deploy_path="${deploy_path%/}"
          deploy_path="${deploy_path#/var/www/$REG_SFTP_USER/data/}"
          deploy_path="${deploy_path#/}"

          case "$deploy_path" in
            www/*) ;;
            *)
              echo "::error::REG_DEPLOY_PATH must point inside the REG.RU www directory"
              exit 1
              ;;
          esac

          lftp -u "$REG_SFTP_USER","$REG_SFTP_PASSWORD" "sftp://$REG_SFTP_HOST:22" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            cd $deploy_path;
            mirror --reverse --delete --parallel=4 --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .vercel/ \
              --exclude-glob config.local.php \
              --exclude-glob storage/*.csv \
              --exclude-glob storage/rate_*.json \
              --exclude-glob storage/files/** \
              --exclude-glob .well-known/** \
              ./ .;
            bye
          "
